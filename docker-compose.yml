services:
  studio:
    build:
      context: .
      target: runtime
    image: rag-framework:latest
    container_name: rag-studio
    ports:
      - "8501:8501"
    volumes:
      # Persist the SQLite database and FAISS indexes across restarts
      - rag-data:/app/data
      # Mount local documents folder for easy ingestion
      - ./docs:/app/docs:ro
    env_file:
      - .env
    environment:
      RAG_DATA_DIR: /app/data
      KMP_DUPLICATE_LIB_OK: "TRUE"   # suppress OpenMP conflict on some hosts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: .
      target: runtime
    image: rag-framework:latest
    container_name: rag-mcp
    command:
      - python
      - -m
      - rag.app.mcp_server.server
    ports:
      # Unified internal/external port (ECOSYSTEM_INTEGRATION_PLAN.md 定案 #1,
      # "方案 A"): container-internal and published port must be the same
      # number, or README/compose/health-check/MAEDA's zero-config default
      # each end up describing a different value. MAEDA's settings.py reads
      # 8002 as its RAG_SERVER_MCP_URL default — this must match.
      - "8002:8002"
    volumes:
      - rag-data:/app/data
    env_file:
      - .env
    environment:
      RAG_DATA_DIR: /app/data
      KMP_DUPLICATE_LIB_OK: "TRUE"
      # A detached container has no client attached to its stdin/stdout, so
      # the stdio transport (this server's default for local/subprocess use
      # — see README §8) doesn't apply here. streamable-http gives it an
      # actual HTTP listener, and MCP_HOST must be 0.0.0.0 (not the
      # loopback-only default) for the published port below to reach it.
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8002"
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy

volumes:
  rag-data:
    driver: local
