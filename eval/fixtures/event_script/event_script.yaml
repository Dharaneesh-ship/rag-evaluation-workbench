  # ---------------------------------------------------------------------
  # distractor (3) — corpus_evidence only, no data_signal: something the
  # corpus documents but that never produced a measurable signal. Tests
  # whether the model wrongly cites it anyway (false attribution rate).
  # ---------------------------------------------------------------------
  - event_id: "EVT-2023-04-SOUTH-DISCOUNT-CAMPAIGN"
