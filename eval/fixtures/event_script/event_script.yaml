# Event script — ground truth for the RAG on/off A/B evaluation.
# Candidate content, pending three-party review (ECOSYSTEM_INTEGRATION_PLAN.md
# 附录 X.7 step 4). Do NOT generate demo data or corpus from this file until
# it is frozen (step 5) — see 附录 Z for rag-framework's sign-off on the
# schema this file follows.
#
# v2 (附录 FR/FS): the 12 events below marked batch: v1 are the frozen v1 events, splits
# inherited from git tag event-script-v1 (verify.py compares against the tag). The batch: v2
# events are content-free slots EVT-V2-NNN; slot i is dev when i mod 3 == 1, else test.
# The v2 test events are NOT in this file: they live in the local-only sealed file.
#
# `split` is not author-assigned (v1: recomputed per X.4; v2: slot rule) — it is recomputed deterministically by
# verify.py per 附录 X.4 and must match what's recorded here.
schema_version: "1"
script_version: "2"

events:
  # ---------------------------------------------------------------------
  # normal (7) — has both data_signal and corpus_evidence: tests
  # attribution accuracy (does the model cite the real cause?).
  # ---------------------------------------------------------------------
  - event_id: "EVT-2023-07-EAST-STOCKOUT"
    event_type: normal
    split: test
    batch: v1
    exposed: true
    business_description: "华东区主力型号断货,持续到八月中旬补货"
    valid_from: "2023-07-05"
    valid_to: "2023-08-14"
    data_signal:
      metric: revenue
      segment: {region: "East"}
      direction: down
      magnitude: 0.30
      shape: step
    corpus_evidence:
      relevance: relevant
      source_types: [email, meeting_notes]
      required_facts: ["断货", "补货时间"]
      lexical_divergence: [synonym, colloquial]
    probe_queries:
      - "华东区七月收入为什么下滑"
      - "东区七八月份销售额走低是什么原因"

  - event_id: "EVT-2022-11-NORTH-PROMO"
